{
  id:"arc",
  tag:"Module 1",
  title:"What Is Arc?",
  html:`
    <p>Arc is a public Layer-1 blockchain built by <strong>Circle</strong> — the company behind USDC, the second-largest stablecoin in the world. Circle isn't calling Arc "just another chain." They're calling it <strong>"the economic OS for the internet"</strong> — a platform meant to host global markets, real-time value movement, and even autonomous AI agents transacting with each other. That's a big claim, and this module is about unpacking exactly what's behind it before we get into the projects built on top.</p>
    <div class="script-note">Script note: this is the frame to set for viewers up front — Arc isn't trying to be the next Solana or the next meme-chain. It's trying to be regulated, institutional financial plumbing that happens to also be public and permissionless to build on. Say that distinction explicitly, because everything else in this course only makes sense once viewers have that frame.</div>

    <h3>Why Circle built its own chain at all</h3>
    <p>Circle didn't need to build a blockchain to issue USDC — USDC already runs on more than a dozen chains, from Ethereum to Solana to Robinhood Chain. So why build Arc? Because none of those chains were built <em>around</em> USDC — Circle is a guest on all of them, subject to someone else's gas token, someone else's validator set, and someone else's roadmap. Arc flips that: Circle controls the base layer, the fee currency, and who's allowed to validate blocks. For a company whose entire business is being the trusted issuer of a regulated dollar-token, owning the rails that token settles on is a strategic move, not just a technical one.</p>

    <h3>The launch, in plain terms</h3>
    <p>Arc's public mainnet went live on <strong>September 16, 2026</strong>. It runs on a proof-of-authority consensus with a <strong>fixed, known, vetted set of validators</strong> — not an open validator market like Ethereum or Solana, where anyone can stake tokens and start validating. Circle's documentation is explicit about this trade-off: developers can deploy contracts and send transactions without approval, while a fixed group of known, vetted institutions produce and validate blocks. In other words, the applications layer is permissionless — anyone can build and launch on Arc, which is exactly why Argus and PionArc could exist within days of mainnet — but the consensus layer underneath it is closed to a known set of operators.</p>

    <div class="stat-grid">
      <div class="stat"><div class="n">~20</div><div class="l">SOC 2 validators</div></div>
      <div class="stat"><div class="n">&lt;1 sec</div><div class="l">Finality</div></div>
      <div class="stat"><div class="n">3,000+</div><div class="l">TPS target</div></div>
      <div class="stat"><div class="n">~$0.01</div><div class="l">Base gas fee</div></div>
    </div>

    <h3>Who's actually validating blocks</h3>
    <p>This is the detail that separates Arc from every other new chain launch: the validator cohort reads like a list of the world's largest financial institutions. Circle's release names eleven institutions plus itself, phased in over time — <strong>BlackRock, Visa, Mastercard, DTCC, Standard Chartered, Sumitomo Corporation, Galaxy, Figment, MoneyGram, Goldman Sachs</strong>, and Circle itself.</p>
    <p>That's not marketing fluff — those are literally the entities producing and signing blocks on this network. Compare that to how a chain like Ethereum or Solana works, where the validator set is open and anonymous by design — anyone with enough staked capital can run a validator, and nobody needs to know who they are. Arc deliberately does the opposite: every validator is a named, regulated, SOC 2-certified institution. That's a feature for the institutions Arc is courting (they get a known counterparty list, audit trails, and sanctions controls) and a trade-off for crypto purists who value permissionless, anonymous consensus as a core value.</p>

    <h3>Why USDC-denominated gas matters</h3>
    <p>Every other major chain makes you hold a separate volatile gas token — ETH for Ethereum, SOL for Solana. Arc charges gas fees directly in USDC. For a builder or an institution, that means predictable, dollar-denominated costs instead of gas prices that swing with a speculative token's price. Think about what that solves in practice: a company running payroll or settling invoices onchain doesn't want its transaction cost to double because a speculative gas token pumped overnight. Pinning gas to USDC turns blockchain fees into something a CFO can actually budget for — which is precisely the audience Arc is built around. That's a deliberate design choice aimed at treasuries, fintechs, and payment companies — not degen traders.</p>

    <h3>What Arc is actually built for</h3>
    <p>Circle groups Arc's target use cases into a handful of categories, and it's worth walking through each one so your audience understands this isn't a vague "blockchain for everything" pitch — it's aimed at specific, real financial workflows:</p>
    <ul>
      <li><strong>Asset tokenization</strong> — issuing and trading tokenized real-world assets with near-instant settlement, so a tokenized bond or fund share can change hands as fast as a stock trade instead of taking days to clear</li>
      <li><strong>Onchain FX</strong> — 24/7 stablecoin-to-stablecoin foreign exchange, replacing a foreign exchange desk that closes on weekends with markets that never sleep</li>
      <li><strong>Cross-border payments & payouts</strong> — near-instant, dollar-based settlement for companies sending money internationally, cutting out the multi-day delays of traditional correspondent banking</li>
      <li><strong>Treasury management</strong> — real-time stablecoin settlement and automated liquidity for businesses managing cash positions across multiple currencies and accounts</li>
      <li><strong>Capital markets settlement</strong> — sub-second finality for high-frequency trading and collateral, where even small settlement delays can create real financial risk</li>
      <li><strong>Agentic economic activity</strong> — letting AI agents pay, trade, and coordinate value in real time, with fees cheap enough for nanopayments — think an AI agent paying another API or agent a fraction of a cent per request, something that's simply not economical on a chain with volatile, expensive gas</li>
    </ul>

    <div class="card legit">
      <span class="label">Key takeaway</span>
      Arc is TradFi infrastructure wearing a blockchain. The validator set alone tells you who this was built for — and it's not retail degens. That context matters for everything else in this course, because it explains why a chain built by BlackRock's and Visa's validators is simultaneously hosting a memecoin casino within days of launch. Both things are true at once, and your audience needs to hold both in their head.
    </div>

    <h3>One important caveat</h3>
    <p>Circle minted 10 billion ARC tokens in the US this week as a technical milestone — but <strong>without committing to a public token launch</strong>. Arc's own official account confirmed this directly: the minting is described as a technical milestone in the Arc roadmap as the network explores a future transition from Proof of Authority toward Proof of Stake — and Circle is flagged as the first publicly traded company to mint a network token for a new blockchain.</p>
    <p>Arc's own words are worth quoting to your audience directly, because they couldn't be clearer: <strong>ARC is not live, tradeable, available for public use, or active for staking, governance, fees, or utility.</strong> The Arc network remains Proof of Authority today, and future ARC functionality and activation remain subject to change. The official contract can be viewed on Arc's own block explorer: <span class="ca">0xA12Cd81d0f9988E3d60c4B6a0D52D368Ef3c788d</span> — but viewing the contract is not the same as being able to buy, trade, or use the token. There is nothing live here yet.</p>
    <div class="script-note">Script note: pull up that official contract page on Arc's explorer on screen here. Seeing a real, verifiable contract address that Arc itself confirmed — alongside the plain statement that it isn't tradeable — is the clearest way to inoculate your audience against fake "ARC token" listings that will inevitably try to front-run the real launch.</div>
    <p>So as of recording this, there is no confirmed public "ARC" investment token from Circle itself — only a minted-but-inactive contract. Anything else trading right now with "ARC" in the name is either infrastructure-layer tooling or a community/memecoin — not Circle's own asset, and not this contract. Make that distinction loudly for your audience, because it's the single easiest way for someone to lose money on this chain in its first week: buying something called "ARC" assuming it's Circle's official token when it isn't — or worse, assuming this confirmed contract is already tradeable when Arc has explicitly said it is not.</p>
  `
},
{
  id:"aave",
  tag:"Module 2",
  title:"Aave V4 on Arc — the institutional DeFi layer",
  html:`
    <p>If Module 1 was "here's the chain," this module is "here's the first real financial product built on it." <strong>Aave</strong> is one of the largest, longest-running lending protocols in DeFi — years of audits, billions in historical TVL, and a track record that spans multiple market cycles including the 2022 downturn that wiped out plenty of newer, weaker DeFi protocols. Aave deploying its next-generation V4 protocol on Arc is the clearest signal that Arc is being taken seriously by real DeFi infrastructure, not just speculative apps. This is the module to slow down on — it's your audience's reference point for what "legitimate" looks like for the rest of the course.</p>

    <h3>What Aave actually does, for anyone new to it</h3>
    <p>Before the Arc-specific details, it's worth grounding viewers who don't already know Aave: it's a lending and borrowing protocol. Users supply assets — like USDC — into a shared pool and earn yield from interest paid by borrowers. Other users borrow against posted collateral. It's the same basic function as a bank's lending desk, except the pool is a smart contract, rates adjust algorithmically based on supply and demand, and anyone with a compatible wallet can participate without an application or credit check. That's the base layer Aave is now bringing to Arc.</p>

    <h3>How we got here — the governance trail</h3>
    <table>
      <tr><th>Date</th><th>Event</th></tr>
      <tr><td>May 29, 2026</td><td>Aave Labs publishes a "Temp Check" governance proposal to deploy V4 on Arc</td></tr>
      <tr><td>Mid-2026</td><td>Proposal advances to ARFC (formal request-for-comment) stage in Aave governance</td></tr>
      <tr><td>Sept 16, 2026</td><td>Aave V4 goes live on Arc at mainnet launch, alongside Morpho</td></tr>
    </table>
    <p>Walk your audience through why this governance trail actually matters: Aave isn't controlled by a single company that can just decide to deploy wherever it wants. It's governed by AAVE token holders through a multi-stage proposal process — a "Temp Check" gauges community sentiment first, before it ever reaches a binding vote. The fact that this process played out publicly, over months, with real money committed, is itself evidence that this deployment was scrutinized rather than rubber-stamped.</p>
    <p>The proposal committed a minimum of <strong>$2 million per year over five years ($10 million total)</strong> to the Aave DAO — positioning Aave as the foundational lending layer for institutions building on Arc. That's a meaningful, multi-year financial commitment, not a marketing partnership announced and forgotten.</p>
    <p>Circle's CEO, Jeremy Allaire, publicly backed the move, calling Aave one of two critical next-generation infrastructures shaping the future of DeFi — a notable public endorsement from the person running the chain itself, not just a routine ecosystem-partner press release.</p>

    <h3>What's actually new in V4</h3>
    <p>Aave V4 isn't just a copy-paste of V3 onto a new chain — it's a real architectural redesign, and understanding the redesign helps explain why Aave felt V4 specifically was ready for an institutional chain like Arc:</p>
    <ul>
      <li><strong>Hub-and-Spoke liquidity model</strong> — a central Liquidity Hub on each chain aggregates assets, while customizable "Spoke" markets draw from that shared liquidity with their own risk parameters. This replaces V3's fragmented, siloed pools, where liquidity for the same asset could be split across many disconnected markets with no way to share depth between them.</li>
      <li><strong>ERC-4626 vaults</strong> — V4 eliminates the rebasing behavior of the old aTokens (V3's interest-bearing receipt tokens, which changed balance automatically as interest accrued), which simplifies accounting for integrators, auditors, and tax software. A non-rebasing token is much easier for institutional accounting systems, spreadsheets, and tax software to handle correctly.</li>
      <li><strong>Built for institutional-scale volume</strong> — the whole redesign is explicitly aimed at handling larger, more predictable flows than the retail-driven usage patterns V3 was designed around, with more granular, configurable risk parameters per market.</li>
    </ul>

    <h3>Who's backing the Arc deployment</h3>
    <p>This isn't Aave alone — a cluster of institutional risk and liquidity players are supporting the Arc market through curated vault strategies, risk oversight, and USDC/EURC supply: <strong>Bitwise, Cumberland, Dialectic, Galaxy, Gauntlet, Keyrock,</strong> and <strong>Steakhouse Financial</strong>. It's worth naming what a few of these actually do on-camera: Gauntlet and Steakhouse Financial are risk-management firms that specialize in setting and monitoring DeFi lending parameters — the kind of firms that get hired specifically to prevent the type of cascading liquidation failures that have sunk other lending protocols. Cumberland and Keyrock are institutional trading and liquidity firms. Having names like this attached isn't cosmetic — it's the risk-management layer that a chain courting BlackRock and Visa actually needs.</p>

    <div class="card warn">
      <span class="label">Important clarification for your audience</span>
      There is no separate "Arc AAVE" coin. This is the existing AAVE protocol and its existing AAVE governance token expanding to a new chain — not a new asset to buy. If someone wants exposure here, it's through <em>using</em> the Arc lending market itself (supplying or borrowing USDC/EURC and other listed assets), not purchasing a new token.
    </div>

    <div class="script-note">Script note: this is a natural spot to actually demo the Arc Aave market on screen if you have access — showing viewers a real supply/borrow interface with real rates does more to build trust than any amount of narration.</div>

    <h3>Why this matters for the rest of the course</h3>
    <p>Keep Aave V4 in your back pocket as the reference point of "what legitimate looks like" on Arc. Every project in the next few modules should be measured against it: does it have real backers, audits, and a track record — or is it a brand-new, unaudited contract that launched this week? By the time you get to Module 3, the contrast will be stark.</p>
  `

{
  id:"argus",
  tag:"Module 3",
  title:"Argus — the token launchpad (and its casino floor)",
  html:`
    <p>Argus (argus.world) is a <strong>permissionless token launchpad</strong> built directly on Arc. Anyone can create a token; tax splits go to the creator, a buyback mechanism, liquidity, and holders — starting from the first trade. Every parameter is fixed at launch, meaning creators can't quietly change the rules on holders after the fact. This is the sharpest possible contrast to Module 2 — Aave V4 is institutions taking months to negotiate a governance proposal; Argus is a stranger deploying a token in minutes with zero oversight. Both are real, both are live on the same chain, and your audience needs to understand both to actually understand Arc.</p>

    <h3>How it actually works</h3>
    <ol>
      <li>A creator deploys a new token through Argus with a fixed tax rate (commonly 1–3% on both buys and sells)</li>
      <li>The token starts trading immediately, usually paired against USDC</li>
      <li>Tokens climb toward a "graduation" milestone — a market-cap threshold at which the token moves into deeper, more permanent liquidity</li>
      <li>A "King of the Hill" board highlights whichever token is pumping hardest that hour</li>
    </ol>
    <p>Walk through why the tax mechanic exists at all: on most bonding-curve launchpads, every buy and sell skims a small percentage that gets redistributed — some back to the token's creator (an incentive to actually promote and support their own launch), some into a buyback pool (which can prop up the price by continually repurchasing tokens from the open market), some into deepening liquidity, and some paid directly to holders. It's a self-sustaining mini-economy built entirely around trading activity itself — there's no external revenue source, no product being sold, no service being rendered. The "product" is the trading.</p>
    <div class="script-note">Script note: show the live Argus homepage on screen here — the "Contenders" and "Top by market cap" boards make this concept click instantly for viewers once they see it. Scrolling through the live token feed in real time is more persuasive than any explanation of how fast and chaotic this market moves.</div>

    <h3>Argus's own token — $ARGUS</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">$ARGUS</div><div class="l">Platform token</div></div>
      <div class="stat"><div class="n">~$28M</div><div class="l">Market cap (observed)</div></div>
      <div class="stat"><div class="n">~$1.1M</div><div class="l">Liquidity (observed)</div></div>
    </div>
    <p>Contract: <span class="ca">0xeCe5cA8bf9220718E5727754026757512212cb3c</span></p>

    card.className='qcard';
    card.innerHTML = `<span class="qnum">Question ${qi+1} of ${quiz.length}</span><h4>${q.q}</h4>`;
    q.opts.forEach((opt,oi)=>{
      const b = document.createElement('button');
      b.className='opt';
      b.textContent = opt;
      b.onclick = ()=>answer(qi,oi,card);
      card.appendChild(b);
    });
    const ex = document.createElement('div');
    ex.className='explain';
    ex.id = `exp-${qi}`;
    ex.textContent = q.exp;
    card.appendChild(ex);
    list.appendChild(card);
  });
}

let scores = {};
function answer(qi,oi,card){
  if(scores[qi] !== undefined) return;
  const correctIdx = quiz[qi].correct;
  const opts = card.querySelectorAll('.opt');
  opts.forEach((o,idx)=>{
    o.disabled = true;
    if(idx===correctIdx) o.classList.add('correct');
    else if(idx===oi) o.classList.add('incorrect');
  });
  document.getElementById(`exp-${qi}`).classList.add('show');
  scores[qi] = (oi===correctIdx);
  if(Object.keys(scores).length === quiz.length){
    const right = Object.values(scores).filter(Boolean).length;
    document.getElementById('scoreBox').style.display='block';
    document.getElementById('scoreNum').textContent = `${right}/${quiz.length}`;
    document.getElementById('scoreBox').scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function go(dir){
  const next = current + dir;
  if(next>=0 && next<total) render(next);
}

render(0);
</script>
</body>
</html>
